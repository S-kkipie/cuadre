<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Cuadre - Pago Recibido</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-highest": "#e2e3e0",
            "tertiary": "#a11813",
            "on-background": "#1a1c1b",
            "on-tertiary": "#ffffff",
            "primary-container": "#0b7a3b",
            "surface-container": "#eeeeeb",
            "on-secondary-fixed": "#2c1600",
            "inverse-primary": "#7adb90",
            "secondary-container": "#fdad55",
            "surface-container-high": "#e8e8e5",
            "on-tertiary-container": "#ffe5e1",
            "on-tertiary-fixed": "#410001",
            "on-primary": "#ffffff",
            "surface-bright": "#f9f9f6",
            "surface": "#f9f9f6",
            "on-primary-fixed-variant": "#005225",
            "on-error-container": "#93000a",
            "background": "#f9f9f6",
            "on-tertiary-fixed-variant": "#910809",
            "on-surface": "#1a1c1b",
            "on-secondary-fixed-variant": "#693c00",
            "secondary-fixed": "#ffdcbd",
            "outline": "#6f7a6e",
            "on-primary-fixed": "#00210b",
            "error": "#ba1a1a",
            "tertiary-fixed-dim": "#ffb4aa",
            "on-secondary-container": "#714200",
            "surface-tint": "#006d33",
            "surface-container-low": "#f4f4f1",
            "on-primary-container": "#a4ffb5",
            "surface-dim": "#dadad7",
            "surface-container-lowest": "#ffffff",
            "secondary-fixed-dim": "#ffb86e",
            "inverse-on-surface": "#f1f1ee",
            "on-error": "#ffffff",
            "on-secondary": "#ffffff",
            "primary-fixed-dim": "#7adb90",
            "error-container": "#ffdad6",
            "inverse-surface": "#2f312f",
            "surface-variant": "#e2e3e0",
            "tertiary-container": "#c43328",
            "on-surface-variant": "#3f493f",
            "primary-fixed": "#96f8aa",
            "tertiary-fixed": "#ffdad5",
            "secondary": "#8a5100",
            "primary": "#005f2b",
            "outline-variant": "#becabc"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xs": "0.25rem",
            "space-xl": "2rem",
            "gutter": "1rem",
            "margin": "1rem",
            "space-sm": "0.5rem"
          },
          "fontFamily": {
            "body-md": ["Public Sans", "sans-serif"],
            "label-lg": ["Public Sans", "sans-serif"],
            "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
            "body-lg": ["Public Sans", "sans-serif"],
            "display": ["Plus Jakarta Sans", "sans-serif"],
            "label-md": ["Public Sans", "sans-serif"]
          },
          "fontSize": {
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "label-lg": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
            "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
            "display": ["64px", { "lineHeight": "72px", "fontWeight": "700" }],
            "label-md": ["14px", { "lineHeight": "18px", "fontWeight": "600" }]

        },
      },
    }

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
    }
    @keyframes subtle-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .animate-badge-pop {
      animation: subtle-pulse 3s ease-in-out infinite;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-primary-container h-full m-0 p-0 text-on-primary select-none antialiased overflow-x-hidden selection:bg-surface-container-lowest selection:text-primary-container" style="background-color: #9A5B00;">
<!-- Mobile Viewport Container: 360dp width calibrated -->
<main class="w-full max-w-sm mx-auto min-h-screen flex flex-col justify-between px-space-lg py-6 bg-primary-container relative" style="background-color: #9A5B00;">
<!-- 1. Top Section: Verification status pill and timestamp -->
<header class="w-full flex flex-col items-center pt-2"></header>
<!-- 2 & 3 & 4 & 5. Central Payment Evidence Core (Visible at 2 meters across the counter) -->
<section class="w-full flex flex-col items-center text-center my-auto py-2">
<!-- Big Check Icon Badge -->
<div class="relative mb-3 animate-badge-pop">
<div class="w-16 h-16 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-lg shadow-black/10"><span class="material-symbols-outlined text-4xl leading-none" data-icon="schedule" style="color: #9A5B00; font-variation-settings: 'FILL' 1, 'wght' 700;">schedule</span></div>
</div>
<!-- Headline Label -->
<p class="font-headline-md text-label-lg font-bold tracking-[0.2em] text-on-primary text-opacity-95 mb-1">PAGO ANTERIOR</p>
<!-- The Massive Amount Display -->
<div class="w-full my-1">
<h1 class="font-display text-display text-on-primary font-extrabold tracking-tight tabular-nums drop-shadow-sm">
          S/ 25.00
        </h1>
</div>
<!-- Payer Name -->
<h2 class="font-headline-md text-headline-md font-bold text-on-primary tracking-wide uppercase mt-1 px-2 line-clamp-1">
        ROSA HUAMAN
      </h2>
<!-- Metadata Line -->
<div class="flex items-center justify-center gap-1.5 text-on-primary/85 font-body-md text-label-md mt-1"><span class="font-semibold text-white">Yape</span><span>•</span><span class="tabular-nums">14:32:07</span><span>•</span><span class="text-white/80">hace 4 min</span></div>
<!-- 5. Security Code Block (Crucial Anti-Fraud Tool) -->
<div class="w-full max-w-[320px] mt-4 mb-2 border border-white/80 bg-white/10 rounded-2xl p-4 text-center text-white backdrop-blur-sm shadow-md"><div class="flex items-center justify-center gap-1.5 mb-1 text-white font-bold text-sm uppercase tracking-wide"><span class="material-symbols-outlined text-base">warning</span><span>Atención</span></div><p class="font-medium text-sm leading-snug text-white">Este pago no es de ahora. No lo uses para confirmar al cliente que tienes enfrente.</p></div><div class="w-full max-w-[280px] mt-6 bg-surface-container-lowest/15 backdrop-blur-md rounded-xl p-3.5 border border-surface-container-lowest/30 shadow-inner" style="opacity: 0.65;">
<div class="flex items-center justify-center gap-1 mb-0.5">
<span class="material-symbols-outlined text-sm text-on-primary/90" data-icon="pin">pin</span>
<span class="font-label-md text-[11px] font-bold tracking-widest text-on-primary/90 uppercase">
            CÓDIGO DE SEGURIDAD
          </span>
</div>
<!-- Huge digits for verbal confirmation -->
<div class="font-headline-lg text-4xl font-extrabold tracking-[0.35em] text-on-primary text-center pl-3 py-0.5 tabular-nums">
          4 1 8
        </div>
<p class="text-[11px] font-body-md text-on-primary/80 tracking-tight">
          Verifica estos 3 dígitos con el cliente
        </p>
</div>
</section>
<!-- 6 & 7. Bottom Action Zone -->
<footer class="w-full flex flex-col items-center pb-2">
<!-- Queue Indicator Pill -->
<!-- Primary Confirmation Button: 56dp height, high thumb ergonomic -->
<button class="w-full h-14 bg-surface-container-lowest active:bg-surface-container text-primary-container font-headline-md font-bold text-lg rounded-xl shadow-lg active:scale-95 transition-transform duration-150 flex items-center justify-center gap-2" id="dismissButton" style="color: #9A5B00;" type="button">
<span>Listo</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Fast counter instruction for merchant -->
<p class="font-label-md text-[12px] text-on-primary/70 text-center mt-2.5">
        Toca Listo o la pantalla para ver el siguiente pago
      </p>
</footer>
</main>
<script>
    // Lightweight micro-interaction for fast counter handling
    const dismissBtn = document.getElementById('dismissButton');
    dismissBtn.addEventListener('click', () => {
      dismissBtn.style.opacity = '0.7';
      dismissBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-xl" data-icon="sync">sync</span>
        <span>Cargando siguiente...</span>
      `;
      setTimeout(() => {
        window.location.reload();
      }, 350);
    });
  </script>
</body></html>
